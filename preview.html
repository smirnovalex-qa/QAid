<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QAid — surface preview</title>
    <style>
      body {
        margin: 0;
        padding: 28px;
        display: flex;
        gap: 36px;
        align-items: flex-start;
        flex-wrap: wrap;
        background: #d4d4d8;
        font-family: system-ui, sans-serif;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        color: #3f3f46;
        font-family: 'IBM Plex Mono', monospace;
      }
      .frame {
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.5);
        background: #fff;
      }
      /* Side panel target 404×724, popup 380×600. Заставляем surface заполнить рамку. */
      #sp {
        width: 404px;
        height: 724px;
      }
      #pu {
        width: 380px;
        height: 600px;
      }
      .frame > div {
        height: 100% !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <div class="col">
      <span class="label">side panel · 404 × 724</span>
      <div class="frame" id="sp"></div>
    </div>
    <div class="col">
      <span class="label">popup · 380 × 600</span>
      <div class="frame" id="pu"></div>
    </div>
    <script type="module" src="/src/_preview/main.tsx"></script>
  </body>
</html>
