name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ВАЖНО: пока не в required checks (см. RELEASING.md). e2e поверх собранного MV3
# требует headed-браузера (под xvfb); стабилизируем, затем делаем blocking.
jobs:
  e2e:
    name: Playwright (собранное расширение)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Кэш браузеров Playwright по версии из lockfile.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build extension
        run: pnpm build

      # MV3 service worker не поднимается в старом headless — гоним под xvfb (headed).
      - name: Run e2e
        run: xvfb-run -a pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
