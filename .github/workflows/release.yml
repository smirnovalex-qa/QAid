name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

# По умолчанию — только чтение; каждый job повышает права точечно.
permissions:
  contents: read

jobs:
  # На push в main: если есть changeset'ы — открываем/обновляем Version PR
  # («Version Packages»): changeset version бампит package.json и CHANGELOG.
  version:
    name: Version PR (changesets)
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # коммит бампа версии/CHANGELOG в Version PR
      pull-requests: write # создание/обновление Version PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Create/update Version PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # По тегу vX.Y.Z: полный гейт качества → сборка → сверка версии → zip → draft Release.
  release:
    name: Draft release (zip + notes)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # создание GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm typecheck && pnpm lint && pnpm test:coverage

      - name: Build extension
        run: pnpm build

      - name: Verify tag == manifest/package version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - name: Package extension (zip)
        run: pnpm run package

      - name: Generate release notes
        run: node scripts/release-notes.mjs > RELEASE_NOTES.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-zip/qaid-*.zip
          body_path: RELEASE_NOTES.md
          draft: true # человек проверяет артефакт/права и публикует
          fail_on_unmatched_files: true

    # --- Опциональная публикация в Chrome Web Store (подключается позже) ---
    # Требует секретов CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN /
    # CWS_EXTENSION_ID (GitHub Encrypted Secrets, только в этом job). На старте —
    # отдаём готовый zip + draft-ноты; фактический upload через chrome-webstore-upload
    # включается отдельным шагом. См. RELEASING.md.
